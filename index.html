<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan de comidas</title>
<meta name="theme-color" content="#2F3B2A">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plan comidas">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --cream:#FAF6F0; --cream-2:#F1E9DC; --olive:#2F3B2A; --olive-soft:#5B7B5A;
    --terracotta:#B5623A; --terracotta-dark:#8F4C2C; --gold:#E8C468; --line:#E4D9C6;
    --c-desayuno:#D9A441; --c-almuerzo:#A8946A; --c-comida:#B5623A; --c-merienda:#8E7B4F; --c-cena:#5B7B5A;
    --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--cream); color:var(--olive); font-family:'Inter',sans-serif;}
  body{padding-bottom:90px;}
  h1,h2,h3{font-family:'Fraunces',serif; margin:0; font-weight:700;}

  header.top{
    padding:calc(18px + env(safe-area-inset-top)) 20px 16px; background:var(--olive); color:var(--cream);
    border-bottom-left-radius:24px; border-bottom-right-radius:24px; position:sticky; top:0; z-index:20;
  }
  header.top h1{font-size:1.4rem;}
  header.top p{margin:4px 0 0; font-size:.8rem; opacity:.75; font-weight:500;}

  main{max-width:640px; margin:0 auto; padding:18px 16px 30px;}
  .view{display:none;} .view.active{display:block;}

  .card{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; margin-bottom:14px;}
  .card h2{font-size:1.05rem; margin-bottom:10px;}
  .hint{font-size:.76rem; opacity:.6; line-height:1.4; margin:6px 0 0;}
  .warn{background:#FBEFD9; border:1px solid #E8C468; border-radius:12px; padding:10px 12px; font-size:.8rem; line-height:1.4; margin-top:10px;}
  .ok-note{background:#E9F0E6; border:1px solid #B9CDB5; border-radius:12px; padding:10px 12px; font-size:.8rem; line-height:1.4; margin-top:10px;}

  /* form */
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .field{display:flex; flex-direction:column; gap:4px; margin-bottom:10px;}
  .field label{font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.4px; opacity:.55;}
  .field input,.field select{
    border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:.95rem; font-family:'Inter',sans-serif;
    background:#fff; color:var(--olive); width:100%;
  }
  .chips{display:flex; gap:6px; flex-wrap:wrap;}
  .chip-day{
    width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:#fff; font-weight:700;
    font-size:.8rem; color:var(--olive); cursor:pointer; font-family:'Inter',sans-serif;
  }
  .chip-day.on{background:var(--terracotta); border-color:var(--terracotta); color:#fff;}

  /* summary */
  .stat-row{display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px dashed var(--line); font-size:.86rem;}
  .stat-row:last-child{border-bottom:none;}
  .stat-row b{font-weight:700;}
  .macro-line{font-size:.82rem; margin-top:8px; line-height:1.5;}
  .big{font-family:'Fraunces',serif; font-size:1.7rem; font-weight:700; color:var(--terracotta);}

  details.help summary{cursor:pointer; font-weight:700; font-size:.88rem; list-style:none;}
  details.help summary::-webkit-details-marker{display:none;}
  details.help ol{padding-left:18px; font-size:.82rem; line-height:1.5; margin:8px 0 0;}
  .linkbox{background:var(--cream-2); border-radius:10px; padding:8px 10px; font-size:.74rem; word-break:break-all; margin-top:8px; user-select:all;}

  /* menu */
  .week-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; gap:8px;}
  .week-nav button.round{
    background:var(--cream-2); border:none; color:var(--olive); width:38px; height:38px; border-radius:50%; font-size:1.1rem; cursor:pointer;
  }
  .week-nav .label{font-family:'Fraunces',serif; font-weight:700; font-size:1rem; text-align:center; flex:1;}
  .week-sub{text-align:center; font-size:.76rem; opacity:.6; margin-bottom:12px;}
  .tools{display:flex; gap:8px; margin-bottom:14px;}
  .btn{
    flex:1; border:1px solid var(--line); background:#fff; color:var(--olive); border-radius:12px; padding:10px; font-weight:700;
    font-size:.8rem; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .btn.primary{background:var(--terracotta); border-color:var(--terracotta); color:#fff;}

  .day-card{background:#fff; border:1px solid var(--line); border-radius:var(--radius); margin-bottom:12px; overflow:hidden;}
  .day-card.today{border-color:var(--terracotta); box-shadow:0 0 0 2px rgba(181,98,58,.15);}
  .day-head{display:flex; align-items:center; justify-content:space-between; padding:11px 14px; background:var(--cream-2); cursor:pointer; gap:8px;}
  .day-head .dname{font-family:'Fraunces',serif; font-weight:700; font-size:1rem; text-transform:capitalize;}
  .day-head .dnum{font-size:.74rem; opacity:.6; font-weight:600; margin-left:6px;}
  .day-head .right{display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
  .pill{font-size:.68rem; font-weight:700; padding:3px 8px; border-radius:10px; background:#fff; border:1px solid var(--line); white-space:nowrap;}
  .pill.kcal{background:var(--olive); border-color:var(--olive); color:#fff;}
  .pill.box{background:var(--terracotta); border-color:var(--terracotta); color:#fff;}
  .pill.done{background:var(--olive-soft); border-color:var(--olive-soft); color:#fff;}
  .day-body{padding:12px 14px 14px; display:none;}
  .day-card.open .day-body{display:block;}

  .controls{display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; margin-bottom:10px;}
  .controls .field{margin:0; flex:1; min-width:110px;}
  .controls .field input{padding:8px 10px; font-size:.9rem;}
  .check-line{display:flex; align-items:center; gap:8px; font-size:.84rem; font-weight:600; padding:8px 0;}
  .check-line input{width:18px; height:18px; accent-color:var(--terracotta);}
  .energy{font-size:.78rem; line-height:1.5; background:var(--cream); border-radius:10px; padding:8px 10px; margin-bottom:10px;}
  .energy b{font-weight:700;}

  .meal{border-top:1px solid var(--line); padding:10px 0 4px;}
  .meal-top{display:flex; align-items:center; justify-content:space-between;}
  .meal-label{display:flex; align-items:center; gap:7px; font-size:.7rem; text-transform:uppercase; letter-spacing:.5px; font-weight:700; opacity:.7;}
  .meal-label i{width:9px; height:9px; border-radius:50%; display:inline-block;}
  .meal-kcal{font-size:.78rem; font-weight:700;}
  .meal-name{font-size:.88rem; font-weight:600; margin:4px 0 6px; cursor:pointer; line-height:1.3;}
  .meal-name span{opacity:.35; font-size:.8rem;}
  ul.ings{list-style:none; padding:0; margin:0 0 4px;}
  ul.ings li{display:flex; justify-content:space-between; font-size:.8rem; padding:2px 0; opacity:.85;}
  ul.ings li em{font-style:normal; font-size:.68rem; opacity:.6; margin-left:6px;}
  .mm{font-size:.7rem; opacity:.55; margin-bottom:6px;}

  .totals{margin-top:6px; background:var(--cream); border-radius:12px; padding:10px 12px;}
  .totals h4{margin:0 0 8px; font-size:.7rem; text-transform:uppercase; letter-spacing:.5px; opacity:.55;}
  .bar-row{margin-bottom:7px;}
  .bar-row .top{display:flex; justify-content:space-between; font-size:.76rem; font-weight:600; margin-bottom:3px;}
  .bar{height:7px; background:#E6DCC8; border-radius:4px; overflow:hidden;}
  .bar span{display:block; height:100%; background:var(--olive-soft); border-radius:4px;}
  .bar span.over{background:var(--terracotta);}

  /* month */
  .month-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .month-nav button{background:var(--cream-2); border:none; color:var(--olive); width:38px; height:38px; border-radius:50%; font-size:1.1rem; cursor:pointer;}
  .month-nav .label{font-family:'Fraunces',serif; font-weight:700; font-size:1.1rem;}
  .weekday-row{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:6px;}
  .weekday-row span{text-align:center; font-size:.68rem; font-weight:700; opacity:.45;}
  .month-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .month-cell{aspect-ratio:1; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:.85rem; font-weight:600; background:#fff; border:1px solid var(--line); cursor:pointer; position:relative;}
  .month-cell.outside{opacity:0; pointer-events:none;}
  .month-cell.done{background:var(--olive-soft); border-color:var(--olive-soft); color:#fff;}
  .month-cell.today{box-shadow:0 0 0 2px var(--terracotta);}
  .month-cell .bx{position:absolute; bottom:3px; right:5px; font-size:.55rem;}
  .legend{display:flex; gap:16px; justify-content:center; margin-top:14px; font-size:.75rem; opacity:.7; flex-wrap:wrap;}
  .legend span{display:flex; align-items:center; gap:6px;}
  .legend i{width:12px; height:12px; border-radius:4px; display:inline-block; border:1px solid var(--line); background:#fff;}
  .legend i.g{background:var(--olive-soft); border-color:var(--olive-soft);}
  .month-summary{margin-top:16px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 16px; font-size:.85rem; text-align:center; font-weight:600;}
  .month-summary span{color:var(--olive-soft); font-family:'Fraunces',serif; font-size:1.3rem; font-weight:700; display:block;}

  /* seg + charts */
  .seg{display:flex; gap:6px;}
  .seg button{flex:1; border:1px solid var(--line); background:#fff; color:var(--olive); border-radius:10px; padding:9px 4px; font-size:.78rem; font-weight:700; cursor:pointer; font-family:'Inter',sans-serif;}
  .seg button.on{background:var(--terracotta); border-color:var(--terracotta); color:#fff;}
  .chart-wrap{position:relative;}
  .chart-wrap svg{width:100%; height:auto; display:block; touch-action:pan-y; overflow:visible;}
  .chart-wrap .gl{stroke:var(--line); stroke-width:1;}
  .chart-wrap .ax{fill:#666B5F; font-size:10px; font-family:'Inter',sans-serif;}
  .chart-wrap .lv{fill:var(--olive); font-size:11px; font-weight:700; font-family:'Inter',sans-serif;}
  .chart-wrap .cx{stroke:#9B8B73; stroke-width:1; stroke-dasharray:3 3;}
  .chart-wrap .tip{position:absolute; pointer-events:none; background:var(--olive); color:#fff; padding:5px 9px; border-radius:8px; font-size:.74rem; font-weight:600; display:none; white-space:nowrap; transform:translate(-50%,-135%);}

  .sw-h{margin:14px 0 6px; font-size:.7rem; text-transform:uppercase; letter-spacing:.5px; opacity:.55; font-weight:700;}

  /* recipes */
  .rec-name{font-family:'Fraunces',serif; font-weight:700; font-size:1.05rem;}
  .rec-meta{font-size:.76rem; opacity:.65; margin:4px 0 8px; line-height:1.4;}
  .calc-out{background:var(--cream); border-radius:10px; padding:9px 12px; font-size:.88rem; margin-bottom:6px;}
  .rf-row{display:grid; grid-template-columns:1fr 84px 34px; gap:6px; margin-bottom:6px;}
  .rf-row select,.rf-row input{border:1px solid var(--line); border-radius:10px; padding:9px 8px; font-size:.85rem; font-family:'Inter',sans-serif; background:#fff; color:var(--olive); min-width:0; width:100%;}
  .rf-row button{border:none; background:var(--cream-2); border-radius:10px; color:var(--terracotta); cursor:pointer;}
  .rf-ing{margin-bottom:10px;}
  .rf-l1{display:grid; grid-template-columns:1fr 34px; gap:6px; margin-bottom:5px;}
  .rf-l1 input,.rf-l2 input,.rf-l2 select{border:1px solid var(--line); border-radius:10px; padding:9px 10px; font-size:.88rem; font-family:'Inter',sans-serif; background:#fff; color:var(--olive); min-width:0; width:100%;}
  .rf-l1 button{border:none; background:var(--cream-2); border-radius:10px; color:var(--terracotta); cursor:pointer;}
  .rf-l2{display:grid; grid-template-columns:92px 108px 1fr; gap:6px; align-items:center;}
  .rf-l2 .rk{font-size:.82rem; text-align:right; white-space:nowrap;}
  .rf-l2 .rk b{color:var(--terracotta);}
  .rk-off{opacity:.5; font-size:.76rem;}
  .ing-sug{background:#fff; border:1px solid var(--line); border-radius:10px; margin-bottom:5px; max-height:260px; overflow-y:auto;}
  .ing-sug:empty{display:none;}
  .sug{display:flex; justify-content:space-between; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:none; border-bottom:1px solid var(--line); padding:10px 12px; font-size:.84rem; cursor:pointer; font-family:'Inter',sans-serif; color:var(--olive);}
  .sug:last-child{border-bottom:none;}
  .sug small{opacity:.6; white-space:nowrap; font-size:.72rem;}
  .sug em{opacity:.55; font-style:normal; font-size:.76rem;}
  .sug.act{color:var(--terracotta); font-weight:600;}
  .sug-info{padding:10px 12px; font-size:.78rem; opacity:.7; line-height:1.4; border-bottom:1px solid var(--line);}
  .rf-prev{background:var(--cream-2); border-radius:12px; padding:10px 12px; font-size:.82rem; line-height:1.55; margin:10px 0;}
  .pool-chip{border:1px solid var(--line); background:#fff; color:var(--olive); border-radius:20px; padding:7px 12px; font-size:.78rem; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif;}
  .pool-chip.on{background:var(--terracotta); border-color:var(--terracotta); color:#fff;}
  .ing-row{display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px dashed var(--line); font-size:.84rem; gap:8px;}
  .ing-row:last-child{border-bottom:none;}
  .ing-row button{background:none; border:none; color:var(--terracotta); font-size:1rem; cursor:pointer;}

  /* sheet */
  .overlay{position:fixed; inset:0; background:rgba(47,59,42,.45); display:none; align-items:flex-end; z-index:50;}
  .overlay.open{display:flex;}
  .sheet{background:var(--cream); width:100%; max-height:80vh; border-top-left-radius:22px; border-top-right-radius:22px; padding:18px 18px 28px; overflow-y:auto;}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .sheet-head h3{font-size:1.05rem;}
  .sheet-head button{background:none; border:none; font-size:1.3rem; color:var(--olive); opacity:.5; cursor:pointer;}
  .pick-item{display:block; width:100%; text-align:left; background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:6px; font-size:.86rem; cursor:pointer; font-family:'Inter',sans-serif; color:var(--olive);}
  .pick-item.sel{background:var(--olive-soft); border-color:var(--olive-soft); color:#fff;}

  /* bottom */
  .bottom-bar{position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line); display:flex; padding:8px 10px calc(8px + env(safe-area-inset-bottom)); z-index:30;}
  .bottom-bar button{flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:.68rem; font-weight:700; color:var(--olive); opacity:.45; cursor:pointer; font-family:'Inter',sans-serif;}
  .bottom-bar button.active{opacity:1; color:var(--terracotta);}
  .bottom-bar .ico{font-size:1.15rem;}

  .toast{position:fixed; left:50%; bottom:100px; transform:translateX(-50%); background:var(--olive); color:#fff; padding:10px 16px; border-radius:20px; font-size:.8rem; font-weight:600; z-index:60; display:none;}
  .toast.show{display:block;}
</style>
</head>
<body>

<header class="top">
  <h1 id="headerTitle">Menú semanal</h1>
  <p id="headerSub"></p>
</header>

<main>
  <section id="view-menu" class="view active"></section>
  <section id="view-recipes" class="view"></section>
  <section id="view-profile" class="view"></section>
  <section id="view-month" class="view"></section>
  <section id="view-progress" class="view"></section>
</main>

<div class="bottom-bar">
  <button id="nav-menu" class="active" onclick="switchView('menu')"><span class="ico">🍽️</span>Menú</button>
  <button id="nav-recipes" onclick="switchView('recipes')"><span class="ico">🥘</span>Recetas</button>
  <button id="nav-profile" onclick="switchView('profile')"><span class="ico">🎯</span>Objetivo</button>
  <button id="nav-month" onclick="switchView('month')"><span class="ico">🗓️</span>Calendario</button>
  <button id="nav-progress" onclick="switchView('progress')"><span class="ico">📈</span>Progreso</button>
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================

   u = gramos por unidad (huevos)
   ========================================================= */
const FOODS = {

  pasta:    {n:'Pasta (en cruda)',               k:360, p:12.5,c:72,  f:1.5},

   BASE AMPLIADA DE ALIMENTOS (valores orientativos por 100 g / 100 ml,
   de tablas nutricionales estándar; se pueden corregir en «Mi despensa»)
   id | nombre | kcal | prot | hidr | grasa | g por unidad[:nombre] | g por cucharada | ml | alias
   ========================================================= */

pimiento_verde|Pimiento verde (fresco)|20|0.9|4.6|0.2|120|||pimientos italiano

alcachofa|Alcachofa|47|3.3|10.5|0.2||||alcachofas

const STORAGE_KEY = 'mealplan-data-v2';
function todayISO(){ return fmtISO(new Date()); }

function defaultData(){
  return {

             mode:'low', typicalSteps:7000, boxMin:50, boxPerWeek:3},

  };

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultData();
    const d = JSON.parse(raw), def = defaultData();
    const oldP = d.profile||{};
    if(oldP.boxPerWeek===undefined && Array.isArray(oldP.boxDays)) oldP.boxPerWeek = oldP.boxDays.length || 3;   // migración: días fijos -> media semanal
    delete oldP.boxDays;
    d.profile = Object.assign(def.profile, oldP);
    d.days = d.days||{}; d.menus = d.menus||{};
    d.customFoods = d.customFoods||{}; d.overrides = d.overrides||{}; d.myRecipes = d.myRecipes||[]; d.measures = d.measures||[];
    return d;
  }catch(e){ return defaultData(); }
}

/* =========================================================

   ========================================================= */
function fmtISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseISO(iso){ return new Date(iso+'T00:00:00'); }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function startOfWeek(d){ const r=new Date(d); const w=(r.getDay()+6)%7; r.setDate(r.getDate()-w); r.setHours(0,0,0,0); return r; }
function weekdayIdx(iso){ return (parseISO(iso).getDay()+6)%7; }
function clamp(x,a,b){ return Math.min(b,Math.max(a,x)); }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }
function ensureDay(iso){ if(!DATA.days[iso]) DATA.days[iso]={}; return DATA.days[iso]; }
const N = v => (v===''||v===null||v===undefined) ? NaN : Number(v);

/* =========================================================
   CÁLCULO ENERGÉTICO
   ========================================================= */
function profileIssues(){
  const p=DATA.profile, issues=[];
  if(!(N(p.age)>=18 && N(p.age)<=90)) issues.push('edad (18-90)');
  if(!(N(p.height)>=120 && N(p.height)<=220)) issues.push('altura (120-220 cm)');
  if(!(N(p.weight)>=35 && N(p.weight)<=250)) issues.push('peso (35-250 kg)');
  if(!(N(p.goalKg)>0 && N(p.goalKg)<=40)) issues.push('kg de grasa a perder');
  if(!(N(p.weeks)>=1 && N(p.weeks)<=52)) issues.push('semanas (1-52)');
  return issues;
}
function profileOk(){ return profileIssues().length===0; }

function bmr(){
  const p=DATA.profile;
  return 10*W() + 6.25*N(p.height) - 5*N(p.age) + (p.sex==='m' ? 5 : -161);
}
function stepsKcal(steps){
  const p=DATA.profile;
  const net = Math.max(0, steps - BASE_STEPS);
  const stride = N(p.height)*0.415/100;           // m por paso
  const km = net*stride/1000;
  return 0.5*W()*km;                       // ~0,5 kcal por kg y km caminado
}
function boxKcal(min){
  return 6.5*W()*(min/60);      // (MET 7,5 - 1 en reposo) x kg x horas
}
function planParams(){
  const p=DATA.profile;
  const avgSteps = Number(p.typicalSteps)||0;
  const boxPerWeek = Number(p.boxPerWeek)||0;
  const avgTdee = bmr()*BASE_FACTOR + stepsKcal(avgSteps) + (boxPerWeek/7)*boxKcal(Number(p.boxMin)||0);
  const required = N(p.goalKg)*7700/(N(p.weeks)*7);
  const cap = 0.25*avgTdee;
  const deficit = Math.min(required, cap);
  const limited = required>cap;
  const realKg = deficit*N(p.weeks)*7/7700;
  const weeksNeeded = Math.ceil(N(p.goalKg)*7700/(deficit*7));
  return {avgTdee, required, deficit, limited, realKg, weeksNeeded, floor:(p.sex==='m'?1500:1200)};
}
function macrosFor(kcal){
  const p=DATA.profile, w=W();
  const protein = Math.round(1.8*w);
  let fat = Math.round((p.mode==='low'?1.0:0.8)*w);
  let carbs = (kcal - protein*4 - fat*9)/4;
  if(carbs<50){
    fat = Math.max(Math.round(0.6*w), Math.round((kcal - protein*4 - 200)/9));
    carbs = (kcal - protein*4 - fat*9)/4;
  }
  return {kcal:Math.round(kcal), p:protein, f:fat, c:Math.max(0,Math.round(carbs))};
}
function dayInfo(iso){
  const p=DATA.profile, d=DATA.days[iso]||{}, pr=planParams();
  const steps = (d.steps!==undefined && d.steps!==null && d.steps!=='') ? Number(d.steps) : Number(p.typicalSteps)||0;
  const boxState = d.box===true ? 'yes' : (d.box===false ? 'no' : 'avg');   // avg = sin decidir: cuenta la media semanal
  const box = boxState==='yes';
  const boxMin = (d.boxMin!==undefined && d.boxMin!==null && d.boxMin!=='') ? Number(d.boxMin) : (Number(p.boxMin)||0);
  const base = bmr()*BASE_FACTOR;
  const ks = stepsKcal(steps);
  const kb = box ? boxKcal(boxMin) : (boxState==='avg' ? boxKcal(boxMin)*(Number(p.boxPerWeek)||0)/7 : 0);
  const maint = base + ks + kb;
  let target = maint - pr.deficit, floored=false;
  if(target < pr.floor){ target = pr.floor; floored=true; }
  target = Math.round(target/10)*10;
  return {iso, steps, box, boxState, boxMin, base, ks, kb, maint, deficit:pr.deficit, target, floored, macros:macrosFor(target)};
}

/* =========================================================
   MENÚ: construcción de comidas con cantidades
   ========================================================= */
function foodKcal(f,g){ return FOODS[f].k*g/100; }
function roundAmount(f,g){
  const fd=FOODS[f];
  if(fd.u){ const u=Math.max(1,Math.round(g/fd.u)); return u*fd.u; }
  return Math.max(5, Math.round(g/5)*5);
}
function buildMeal(recipe, targetKcal, extra, maxF){
  const items = recipe.items.concat(extra?[extra]:[]);
  let F=0,S=0;
  items.forEach(it=>{ const k=foodKcal(it.f,it.g); if(it.s) S+=k; else F+=k; });
  let factor = S>0 ? (targetKcal-F)/S : 1;
  factor = clamp(factor, 0.4, maxF||2.2);
  const lines = items.map(it=>{
    let g = it.s ? roundAmount(it.f, it.g*factor) : it.g;
    if(FOODS[it.f].mx) g = Math.min(g, FOODS[it.f].mx);   // embutidos: tope por ración (sal)
    return {f:it.f, g, s:!!it.s, tag:it.tag||''};
  });
  let k=0,p=0,c=0,fa=0,sk=0;
  lines.forEach(l=>{
    const fd=FOODS[l.f], q=l.g/100;
    k+=fd.k*q; p+=fd.p*q; c+=fd.c*q; fa+=fd.f*q;
    if(l.s) sk+=fd.k*q;
  });
  return {name:recipe.name, lines, kcal:k, p, c, f:fa, scalKcal:sk};
}
function recipeById(pool,id){ return RECIPES[pool].find(r=>r.id===id) || customRecipeById(id) || RECIPES[pool][0]; }

function carbSideFor(iso, info, slotKey){
  const balanced = DATA.profile.mode==='balanced';
  const needs = slotKey==='comida' ? (info.box || balanced) : (slotKey==='cena' && balanced);
  if(!needs) return null;
  const shift = slotKey==='cena' ? 1 : 0;
  const idx = (Math.floor(parseISO(iso).getTime()/86400000) + shift) % CARB_SIDES.length;
  const side = Object.assign({}, CARB_SIDES[idx]);
  if(!balanced) side.tag='guarnición (día de entreno)';
  return side;
}

function buildDay(iso){
  const info = dayInfo(iso);
  const menu = DATA.menus[iso] || {};
  const sides = {};
  SLOTS.forEach(s=>{ sides[s.key] = carbSideFor(iso, info, s.key); });
  const recs = SLOTS.map(s=>recipeById(s.pool, menu[s.key]));
  let meals = SLOTS.map((s,i)=>buildMeal(recs[i], info.target*s.pct, sides[s.key]));
  let total = meals.reduce((a,m)=>a+m.kcal,0);
  const left = info.target-total;
  if(Math.abs(left) > info.target*0.03){
    const W = meals.reduce((a,m)=>a+m.scalKcal,0);
    if(W>0){
      meals = SLOTS.map((s,i)=>buildMeal(recs[i], meals[i].kcal + left*meals[i].scalKcal/W, sides[s.key], 3.2));
    }
  }
  const t = meals.reduce((a,m)=>({k:a.k+m.kcal,p:a.p+m.p,c:a.c+m.c,f:a.f+m.f}),{k:0,p:0,c:0,f:0});
  return {info, meals, totals:t};
}

/* generación del menú semanal */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function picker(pool){
  let q=[];
  return ()=>{ if(!q.length) q=shuffle(RECIPES[pool].map(r=>r.id)); return q.pop(); };
}
function randomMenu(){
  const pick = pool => { const l = RECIPES[pool].filter(r=>r.auto!==false); return l[Math.floor(Math.random()*l.length)].id; };
  const a = pick('snack'); let b = pick('snack'), t = 0;
  while(b===a && t<10){ b = pick('snack'); t++; }
  return {desayuno:pick('desayuno'), almuerzo:a, comida:pick('comida'), merienda:b, cena:pick('cena')};
}
function fitScore(d){
  const t=d.totals, m=d.info.macros, k=d.info.target;
  return 3*Math.abs(t.k-k)/k + 2*Math.abs(t.p-m.p)/m.p + Math.abs(t.c-m.c)/Math.max(m.c,50) + Math.abs(t.f-m.f)/m.f;
}
/* Para cada día prueba muchas combinaciones y se queda con la que mejor encaja
   con las kcal y los macros del día, evitando repetir platos en la semana. */
function generateWeek(dates, force){
  const used = {desayuno:new Set(), almuerzo:new Set(), comida:new Set(), merienda:new Set(), cena:new Set()};
  const weights = {desayuno:.35, almuerzo:.12, comida:.35, merienda:.12, cena:.35};
  dates.forEach(iso=>{
    if(DATA.menus[iso] && !force){
      SLOTS.forEach(s=>used[s.key].add(DATA.menus[iso][s.key]));
      return;
    }
    let best=null, bestScore=Infinity;
    for(let n=0;n<200;n++){
      const cand = randomMenu();
      DATA.menus[iso] = cand;
      let score = fitScore(buildDay(iso));
      SLOTS.forEach(s=>{ if(used[s.key].has(cand[s.key])) score += weights[s.key]; });
      if(score<bestScore){ bestScore=score; best=cand; }
    }
    DATA.menus[iso] = best;
    SLOTS.forEach(s=>used[s.key].add(best[s.key]));
  });
  saveData();
}

  return g+(fd.ml?' ml':' g');
}

   RECETAS PROPIAS: ingredientes con gramos -> kcal y macros por ración
   ========================================================= */
const POOLS = [
  {key:'desayuno', label:'Desayuno'},
  {key:'snack',    label:'Almuerzo / merienda'},
  {key:'comida',   label:'Comida'},
  {key:'cena',     label:'Cena'}
];
let formOpen = false;
let draft = null;

function norm(s){ return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }

function recipeTotals(r){
  if(r.direct){ const w=Number(r.portionG)||0; return {k:r.direct.k, p:r.direct.p, c:r.direct.c, f:r.direct.f, w, sum:w}; }   // alta rápida: valores de una ración
  let k=0,p=0,c=0,f=0,sum=0;
  (r.ingredients||[]).forEach(i=>{
    const fd=FOODS[i.f]; if(!fd || fd.dish) return;
    const g=Number(i.g)||0, q=g/100;
    k+=fd.k*q; p+=fd.p*q; c+=fd.c*q; f+=fd.f*q; sum+=g;
  });
  const w = Number(r.totalG)>0 ? Number(r.totalG) : sum;
  return {k,p,c,f,w,sum};
}

/* Registra ingredientes y recetas propias para que el menú las pueda usar */
function registerCustom(){
  Object.keys(FOODS).forEach(k=>{ if(FOODS[k].custom) delete FOODS[k]; });
  Object.keys(RECIPES).forEach(p=>{ RECIPES[p] = RECIPES[p].filter(r=>!r.custom); });
  Object.keys(BASE_VALS).forEach(k=>{            // valores de la base + correcciones del usuario
    const x=FOODS[k]; if(!x) return;
    const o=(DATA.overrides||{})[k], b=BASE_VALS[k];
    x.k=o?o.k:b[0]; x.p=o?o.p:b[1]; x.c=o?o.c:b[2]; x.f=o?o.f:b[3]; x.mod=!!o;
  });
  Object.keys(DATA.customFoods).forEach(k=>{
    const c=DATA.customFoods[k];
    FOODS[k] = {n:c.n, k:c.k, p:c.p, c:c.c, f:c.f, custom:true, ing:true, src:c.src||'', al:norm(c.b||'')};
    if(c.u>0) FOODS[k].u=c.u;
  });
  DATA.myRecipes.forEach(r=>{
    const t=recipeTotals(r);
    if(!(t.w>0)) return;
    const key='u_'+r.id;
    FOODS[key] = {n:r.name, k:t.k*100/t.w, p:t.p*100/t.w, c:t.c*100/t.w, f:t.f*100/t.w, custom:true, dish:true};
    (r.pools||[]).forEach(pool=>{
      if(RECIPES[pool]) RECIPES[pool].push({id:key, name:r.name, custom:true, auto:r.auto!==false,
        items:[{f:key, g:Number(r.portionG)||250, s:1}]});
    });
  });
}

/* ---- Buscador de alimentos y unidades ---- */
const ALIASES = [
  [/lenteja/,'lentejas'],
  [/huevo/,'huevo'],
  [/lomo.*(embut|embuch)|(embut|embuch).*lomo/,'lomoemb'],
  [/solomillo|pollo|pechuga/,'pollo'],
  [/lomo|cinta/,'lomo'],
  [/jamon/,'jamon'],
  [/atun/,'atun'],
  [/melva/,'melva'],
  [/yogur/,'yogur'],
  [/arandan/,'arandanos'],
  [/cereza/,'cerezas'],
  [/cacahuete/,'cacahuete'],
  [/judia/,'judias'],
  [/pimiento/,'pimientos'],
  [/queso.*cabra|cabra/,'cabra'],
  [/hamburguesa|ternera|carne picada/,'hamburguesa'],
  [/pisto/,'pisto'],
  [/salmorejo/,'salmorejo'],
  [/crema/,'crema'],
  [/tomate/,'tomate'],
  [/lechuga|espinaca|canonigo|rucula|hojas/,'hojas'],
  [/aceite|aove/,'aove'],
  [/arroz/,'arroz'],
  [/pasta|espagueti|macarron|fideo|tallarin/,'pasta'],
  [/\bpan\b/,'pan'],
  [/avena/,'avena']
];
const DEFAULT_UNIT_G = {tomate:120, pimientos:80, yogur:125, hamburguesa:120};
const SPOON_G = {aove:10, cacahuete:15};
const STOPWORDS = ['de','del','la','el','los','las','con','en','y','al','a'];

function unitG(key){ const fd=FOODS[key]; return (fd&&fd.u) || DEFAULT_UNIT_G[key] || 0; }       // gramos de 1 unidad
function spoonG(key){ const fd=FOODS[key]; return (fd&&fd.sp) || SPOON_G[key] || 0; }          // gramos de 1 cucharada
function unitLabel(key){ return (FOODS[key]&&FOODS[key].ul) || 'ud'; }
function clean(s){ return norm(s).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
function stems(w){ const o=[w]; if(w.length>3 && w.endsWith('s')) o.push(w.slice(0,-1)); if(w.length>4 && w.endsWith('es')) o.push(w.slice(0,-2)); return o; }

/* Busca en toda la base (tuya incluida). Cada palabra escrita debe aparecer al inicio de una palabra del nombre o de sus alias */
function searchFoods(q, limit){
  const t=clean(q); if(!t) return [];
  const words=t.split(' ').filter(w=>w && !STOPWORDS.includes(w));
  if(!words.length) return [];
  const wantsCooked=/cocid|cocin|plancha|asad/.test(t);
  const res=[];
  Object.keys(FOODS).forEach(k=>{
    const fd=FOODS[k]; if(fd.dish) return;
    const nn=' '+clean(fd.n), hay=nn+' '+clean(fd.al||'');
    let s=0;
    for(const w of words){
      const v=stems(w).find(x=>hay.includes(' '+x));
      if(!v) return;
      s += nn.includes(' '+v) ? 4 : 1;
    }
    if(nn.trim()===t) s+=30;
    if(stems(words[0]).some(v=>nn.startsWith(' '+v))) s+=6;
    if(fd.custom) s+=3;
    if(!wantsCooked && /cocinad|cocid/.test(nn)) s-=6;
    s -= nn.length*0.05;
    res.push([s,k]);
  });
  res.sort((a,b)=>b[0]-a[0]);
  return res.slice(0,limit||8).map(x=>x[1]);
}
function matchFood(text){
  const t=norm(text).trim();
  if(!t) return null;
  const multi = clean(t).split(' ').filter(w=>w && !STOPWORDS.includes(w)).length > 1;
  const byAlias = ()=>{ for(const [re,key] of ALIASES){ if(re.test(t) && FOODS[key]) return key; } return null; };
  if(multi){ const r=searchFoods(t,1); if(r.length) return r[0]; return byAlias(); }
  return byAlias() || (searchFoods(t,1)[0] || null);
}
function parseIngredients(text){
  const rows=[], unknown=[];
  const re=/^(\d+(?:[.,]\d+)?)\s*(?:(kg|gramos?|gr|g|ml|litros?|l|uds?|unidades?|cucharaditas?|cucharadas?|cdas?|cdtas?|dientes?|lonchas?|rebanadas?|rodajas?|piezas?|onzas?|palitos?)(?![a-z]))?\.?\s*(?:de\s+)?(.+)$/i;
  text.split(/\n|;/).map(s=>s.trim().replace(/^[-•*]\s*/,'')).filter(Boolean).forEach(line=>{
    const m=line.match(re);
    if(!m){ unknown.push(line); return; }
    const qty=parseFloat(m[1].replace(',','.')), unit=(m[2]||'').toLowerCase(), name=m[3];
    const key=matchFood(name);
    if(!key){ unknown.push(line); return; }
    const uw=unitG(key);
    let g=NaN;
    if(/^(kg)$/.test(unit)) g=qty*1000;
    else if(/^(g|gr|gramos?|ml)$/.test(unit)) g=qty;
    else if(/^(l|litros?)$/.test(unit)) g=qty*1000;
    else if(/^(uds?|unidades?|dientes?|lonchas?|rebanadas?|rodajas?|piezas?|onzas?|palitos?)$/.test(unit)) g=uw ? qty*uw : NaN;
    else if(/^(cucharadas?|cdas?)$/.test(unit)) g=qty*(spoonG(key)||15);
    else if(/^(cucharaditas?|cdtas?)$/.test(unit)) g=qty*((spoonG(key)||15)/3);
    else g = (qty<=12 && uw) ? qty*uw : qty;       // sin unidad: "2 huevos" o "200 lentejas"
    if(!(g>0)){ unknown.push(line+' (indica los gramos)'); return; }
    rows.push({f:key, g:Math.round(g)});
  });
  return {rows, unknown};
}

/* ---- Formulario ---- */
function newDraft(){
  return {id:null, name:'', mode:'ing', rows:[mkRow('','')], totalG:'', portionG:250,
    direct:{k:'',p:'',c:'',f:''},
    pools:{desayuno:false,snack:false,comida:true,cena:false}, auto:true, showNew:false, newFor:null, newName:'', pasteMsg:''};
}
/* Una fila de ingrediente: q = cantidad en la unidad un (g, ud, cda, cdta); g = gramos equivalentes */
function mkRow(f,g){
  const ok = f && FOODS[f];
  return {f:ok?f:'', txt:ok?FOODS[f].n:'', q:(g===''||g===undefined)?'':g, un:'g', g:Number(g)||0};
}
function rowFactor(r){
  if(!r.f || !FOODS[r.f]) return 1;
  if(r.un==='ud') return unitG(r.f)||1;
  if(r.un==='cda') return spoonG(r.f)||15;
  if(r.un==='cdta') return (spoonG(r.f)||15)/3;
  return 1;
}
function rowCalc(r){ r.g = (Number(r.q)||0) * rowFactor(r); }
function rowUnits(r){
  const out=[['g', (r.f&&FOODS[r.f]&&FOODS[r.f].ml)?'ml':'g']];
  if(r.f && unitG(r.f)>0) out.push(['ud', unitLabel(r.f)]);
  if(r.f && spoonG(r.f)>0){ out.push(['cda','cucharada']); out.push(['cdta','cucharadita']); }
  return out;
}
function rowBadge(r){
  const fd=r.f&&FOODS[r.f];
  if(!fd) return '<span class="rk-off">elige uno de la lista</span>';
  if(!(r.g>0)) return `<span class="rk-off">${Math.round(fd.k)} kcal / 100 g</span>`;
  return (r.un!=='g' ? Math.round(r.g)+' g · ' : '') + `<b>${Math.round(fd.k*r.g/100)} kcal</b>`;
}
function rowHtml(r,i){
  const opts=rowUnits(r).map(([v,l])=>`<option value="${v}" ${r.un===v?'selected':''}>${esc(l)}</option>`).join('');
  return `<div class="rf-ing">
    <div class="rf-l1"><input type="text" id="rn-${i}" autocomplete="off" autocapitalize="none" placeholder="Buscar ingrediente (ej. calabacín)" value="${esc(r.txt)}" oninput="ingSearch(${i},this.value)" onfocus="ingFocus(${i},this)"><button onclick="delRow(${i})">✕</button></div>
    <div class="ing-sug" id="rs-${i}"></div>
    <div class="rf-l2"><input type="number" id="rq-${i}" inputmode="decimal" placeholder="cant." value="${r.q}" oninput="rowQ(${i},this.value)"><select id="ru-${i}" onchange="rowUn(${i},this.value)">${opts}</select><span class="rk" id="rk-${i}">${rowBadge(r)}</span></div>
  </div>`;
}
function openRecipeForm(id){
  if(id){
    const r=DATA.myRecipes.find(x=>x.id===id); if(!r) return;
    draft={id:r.id, name:r.name, mode:r.direct?'direct':'ing',
      rows:(r.ingredients&&r.ingredients.length) ? r.ingredients.map(i=>mkRow(i.f,i.g)) : [mkRow('','')],
      totalG:r.totalG||'', portionG:r.portionG||250,
      direct:r.direct ? {k:r.direct.k, p:r.direct.p, c:r.direct.c, f:r.direct.f} : {k:'',p:'',c:'',f:''},
      pools:{desayuno:false,snack:false,comida:false,cena:false}, auto:r.auto!==false, showNew:false, newFor:null, newName:'', pasteMsg:''};
    (r.pools||[]).forEach(p=>{ draft.pools[p]=true; });
  } else draft=newDraft();
  formOpen=true;
  renderRecipeForm();
  document.getElementById('overlay').classList.add('open');
}
function renderRecipeForm(){
  const sheet=document.getElementById('sheet'), sc=sheet.scrollTop, d=draft, direct=d.mode==='direct';
  const modeSeg=`<div class="seg"><button class="${direct?'':'on'}" onclick="setRecipeMode('ing')">Con ingredientes</button><button class="${direct?'on':''}" onclick="setRecipeMode('direct')">Kcal por ración</button></div>`;

  const ingHtml=`<details class="help" style="margin-bottom:12px;"><summary>📋 Pegar lista de ingredientes</summary>
      <textarea id="rf-paste" rows="4" style="width:100%; margin-top:8px; border:1px solid var(--line); border-radius:10px; padding:10px; font-family:'Inter',sans-serif; font-size:.85rem;" placeholder="200 g lentejas&#10;2 huevos&#10;150 g solomillo de pollo&#10;1 cucharada de aceite"></textarea>
      <button class="btn" style="margin-top:6px; width:100%;" onclick="importPaste()">Importar ingredientes</button>
      ${d.pasteMsg?`<p class="hint">${esc(d.pasteMsg)}</p>`:''}
    </details>
    <div class="field" style="margin-bottom:6px;"><label>Ingredientes</label><p class="hint" style="margin:0 0 6px;">Escribe el nombre, elige de la lista y pon la cantidad. Los gramos, en crudo.</p></div>
    ${d.rows.map((r,i)=>rowHtml(r,i)).join('')}
    <div class="tools" style="margin:8px 0 12px;"><button class="btn" onclick="addRow()">＋ Ingrediente</button><button class="btn" onclick="toggleNewIng()">＋ Crear a mano</button></div>
    ${d.showNew?`<div class="rf-prev">
      <div class="field"><label>Nombre del ingrediente</label><input id="ni-name" type="text" value="${esc(d.newName||'')}"></div>
      <div class="grid2">
        <div class="field"><label>kcal / 100 g</label><input id="ni-k" type="number" inputmode="decimal"></div>
        <div class="field"><label>Proteína (g)</label><input id="ni-p" type="number" inputmode="decimal"></div>
        <div class="field"><label>Hidratos (g)</label><input id="ni-c" type="number" inputmode="decimal"></div>
        <div class="field"><label>Grasa (g)</label><input id="ni-f" type="number" inputmode="decimal"></div>
      </div>
      <div class="field"><label>Peso de 1 unidad (g), opcional</label><input id="ni-u" type="number" inputmode="decimal" placeholder="Ej. 125 para un yogur"></div>
      <button class="btn primary" style="width:100%;" onclick="saveNewIng()">Guardar en Mi despensa</button>
      <p class="hint">Valores por 100 g, los de la etiqueta. Proteína, hidratos y grasa son opcionales.</p></div>`:''}
    <div class="grid2">
      <div class="field"><label>Peso total cocinado (g)</label><input type="number" inputmode="decimal" value="${d.totalG}" placeholder="opcional" oninput="rfTotal(this.value)"></div>
      <div class="field"><label>Peso de tu ración (g)</label><input type="number" inputmode="decimal" value="${d.portionG}" oninput="rfPortion(this.value)"></div>
    </div>`;

  const directHtml=`<div class="rf-prev">
      <div class="grid2">
        <div class="field"><label>kcal de una ración</label><input type="number" inputmode="decimal" value="${d.direct.k}" oninput="rfDirect('k',this.value)"></div>
        <div class="field"><label>Proteína (g)</label><input type="number" inputmode="decimal" value="${d.direct.p}" oninput="rfDirect('p',this.value)"></div>
        <div class="field"><label>Hidratos (g)</label><input type="number" inputmode="decimal" value="${d.direct.c}" oninput="rfDirect('c',this.value)"></div>
        <div class="field"><label>Grasa (g)</label><input type="number" inputmode="decimal" value="${d.direct.f}" oninput="rfDirect('f',this.value)"></div>
      </div>
      <p class="hint">Los valores de una ración completa. Proteína, hidratos y grasa son opcionales.</p></div>
    <div class="field"><label>Peso de esa ración (g)</label><input type="number" inputmode="decimal" value="${d.portionG}" oninput="rfPortion(this.value)">
      <p class="hint">Con el peso, el menú puede ajustar la cantidad a las kcal de cada día.</p></div>`;

  sheet.innerHTML = `<div class="sheet-head"><h3>${d.id?'Editar receta':'Nueva receta'}</h3><button onclick="closeSheet()">✕</button></div>
  <div class="field"><label>Nombre</label><input type="text" value="${esc(d.name)}" placeholder="Ej. Lentejas estofadas" oninput="draft.name=this.value"></div>
  <div class="field"><label>Cómo la quieres añadir</label>${modeSeg}</div>
  ${direct ? directHtml : ingHtml}
  <div class="rf-prev" id="rf-prev"></div>
  <div class="field"><label>Sugerir automáticamente en</label><div class="chips">${POOLS.map(p=>`<button type="button" class="pool-chip ${d.pools[p.key]?'on':''}" onclick="rfPool('${p.key}',this)">${p.label}</button>`).join('')}</div></div>
  <label class="check-line"><input type="checkbox" ${d.auto?'checked':''} onchange="draft.auto=this.checked"> Incluirla en los menús automáticos</label>
  <p class="hint" style="margin-bottom:12px;">Siempre podrás cambiar cualquier plato del menú por esta receta, esté o no marcada aquí.</p>
  <button class="btn primary" style="width:100%;" onclick="saveRecipe()">Guardar receta</button>`;
  sheet.scrollTop=sc;
  updatePreview();
}
function draftRecipeObj(){
  const d=draft;
  if(d.mode==='direct'){
    return {direct:{k:Number(d.direct.k)||0, p:Number(d.direct.p)||0, c:Number(d.direct.c)||0, f:Number(d.direct.f)||0}, portionG:Number(d.portionG)||0};
  }
  return {ingredients:d.rows.filter(r=>r.f && Number(r.g)>0).map(r=>({f:r.f, g:Number(r.g)})), totalG:d.totalG};
}
function updatePreview(){
  const el=document.getElementById('rf-prev'); if(!el||!draft) return;
  const r=draftRecipeObj();
  if(draft.mode==='direct'){
    if(!(r.direct.k>0)){ el.innerHTML='Escribe las kcal de una ración para verlas aquí.'; return; }
    const t=recipeTotals(r);
    if(!(t.w>0)){ el.innerHTML=`<b>Una ración:</b> ${Math.round(t.k)} kcal · P ${Math.round(t.p)} · C ${Math.round(t.c)} · G ${Math.round(t.f)}<br><span style="opacity:.6">Indica el peso de la ración para calcular los valores por 100 g.</span>`; return; }
    const per=100/t.w;
    el.innerHTML=`<b>Una ración de ${Math.round(t.w)} g:</b> <span style="color:var(--terracotta); font-weight:700;">${Math.round(t.k)} kcal</span> · P ${Math.round(t.p)} · C ${Math.round(t.c)} · G ${Math.round(t.f)}<br>
      <b>Cada 100 g:</b> ${Math.round(t.k*per)} kcal · P ${(t.p*per).toFixed(1)} · C ${(t.c*per).toFixed(1)} · G ${(t.f*per).toFixed(1)}`;
    return;
  }
  if(!r.ingredients.length){ el.innerHTML='Añade ingredientes con su cantidad para ver las calorías.'; return; }
  const t=recipeTotals(r);
  const per=100/t.w, pg=Number(draft.portionG)||0, q=pg/t.w;
  el.innerHTML = `<b>Plato completo</b> (${Math.round(t.w)} g): <span style="color:var(--terracotta); font-weight:700;">${Math.round(t.k)} kcal</span> · P ${Math.round(t.p)} · C ${Math.round(t.c)} · G ${Math.round(t.f)}<br>
    <b>Cada 100 g:</b> ${Math.round(t.k*per)} kcal<br>
    <b>Tu ración de ${pg} g:</b> <span style="color:var(--terracotta); font-weight:700;">${Math.round(t.k*q)} kcal</span> · P ${Math.round(t.p*q)} · C ${Math.round(t.c*q)} · G ${Math.round(t.f*q)}
    ${Number(draft.totalG)>0 ? '' : '<br><span style="opacity:.6">Sin peso cocinado uso la suma de ingredientes en crudo. Si el plato pierde o gana agua al cocinarse, pésalo ya hecho y ponlo arriba para que la ración sea exacta.</span>'}`;
}

/* ---- Filas: búsqueda, cantidad y unidad ---- */
function refreshRow(i){
  const r=draft.rows[i];
  const rk=document.getElementById('rk-'+i); if(rk) rk.innerHTML=rowBadge(r);
  const ru=document.getElementById('ru-'+i);
  if(ru) ru.innerHTML=rowUnits(r).map(([v,l])=>`<option value="${v}" ${r.un===v?'selected':''}>${esc(l)}</option>`).join('');
  updatePreview();
}
function ingFocus(i,el){
  const r=draft.rows[i];
  if(r.f){ try{ el.select(); }catch(e){} } else showSug(i);
}
function ingSearch(i,v){
  const r=draft.rows[i]; r.txt=v;
  if(r.f && FOODS[r.f] && clean(v)!==clean(FOODS[r.f].n)){ r.f=''; r.un='g'; rowCalc(r); refreshRow(i); }   // ha cambiado el texto: hay que volver a elegir
  showSug(i);
}
function sugBtn(i,k){
  const fd=FOODS[k];
  return `<button type="button" class="sug" onclick="pickFood(${i},'${k}')"><span>${esc(fd.n)}${fd.mod?' <em>· corregido</em>':''}</span><small>${Math.round(fd.k)} kcal</small></button>`;
}
function showSug(i){
  const box=document.getElementById('rs-'+i); if(!box) return;
  const r=draft.rows[i], t=(r.txt||'').trim();
  if(r.f){ box.innerHTML=''; return; }
  const keys = t ? searchFoods(t,7) : Object.keys(FOODS).filter(k=>FOODS[k].custom && FOODS[k].ing).slice(-5).reverse();
  let h = keys.map(k=>sugBtn(i,k)).join('');
  if(t.length>=2){
    if(!keys.length) h = '<div class="sug-info">No lo tengo en la base todavía.</div>';
    h += `<button type="button" class="sug act" onclick="webSearch(${i})">🌐 Buscar «${esc(t)}» en internet</button><button type="button" class="sug act" onclick="newIngFor(${i})">＋ Crear «${esc(t)}» a mano</button>`;
  }
  box.innerHTML=h;
}
function pickFood(i,k){
  const r=draft.rows[i]; if(!FOODS[k]) return;
  r.f=k; r.txt=FOODS[k].n; r.un='g'; rowCalc(r);
  renderRecipeForm();
  const q=document.getElementById('rq-'+i); if(q) q.focus();
}
function rowQ(i,v){ const r=draft.rows[i]; r.q=v; rowCalc(r); refreshRowBadge(i); updatePreview(); }
function refreshRowBadge(i){ const rk=document.getElementById('rk-'+i); if(rk) rk.innerHTML=rowBadge(draft.rows[i]); }
function rowUn(i,u){
  const r=draft.rows[i], g=r.g;
  r.un=u;
  const fac=rowFactor(r);
  if(g>0) r.q = Math.round(g/fac*10)/10;     // mantiene los mismos gramos y cambia cómo se muestran
  renderRecipeForm();
}
function addRow(){ draft.rows.push(mkRow('','')); renderRecipeForm(); const e=document.getElementById('rn-'+(draft.rows.length-1)); if(e) e.focus(); }
function delRow(i){ draft.rows.splice(i,1); if(!draft.rows.length) draft.rows.push(mkRow('','')); renderRecipeForm(); }
function rfTotal(v){ draft.totalG=v; updatePreview(); }

/* ---- Búsqueda en internet (Open Food Facts) ---- */
let webRes = [];
function numOr(v){ const n=Number(v); return (v===null||v===undefined||v===''||!isFinite(n)) ? null : n; }
function r1(n){ return Math.round(n*10)/10; }
function parseOFF(data){
  const out=[], seen={};
  ((data&&data.products)||[]).forEach(p=>{
    const nu=p.nutriments||{};
    let k=numOr(nu['energy-kcal_100g']);
    if(k===null){ const kj=numOr(nu['energy_100g']!==undefined?nu['energy_100g']:nu['energy-kj_100g']); if(kj!==null) k=kj/4.184; }
    if(k===null || k<0 || k>900) return;
    const name=String(p.product_name_es||p.product_name||'').trim(); if(!name) return;
    const brand=String(p.brands||'').split(',')[0].trim();
    const sig=clean(name+' '+brand)+'|'+Math.round(k); if(seen[sig]) return; seen[sig]=1;
    out.push({code:String(p.code||''), n:name, b:brand, k:Math.round(k),
      p:r1(numOr(nu.proteins_100g)||0), c:r1(numOr(nu.carbohydrates_100g)||0), f:r1(numOr(nu.fat_100g)||0)});
  });
  return out.slice(0,12);
}
async function webSearch(i){
  const r=draft.rows[i], t=(r.txt||'').trim();
  const box=document.getElementById('rs-'+i); if(!box || t.length<2) return;
  const manual=`<button type="button" class="sug act" onclick="newIngFor(${i})">＋ Crear «${esc(t)}» a mano</button>`;
  if(navigator.onLine===false){ box.innerHTML='<div class="sug-info">Sin conexión. Puedes crearlo a mano.</div>'+manual; return; }
  box.innerHTML=`<div class="sug-info">Buscando «${esc(t)}» en Open Food Facts…</div>`;
  let timer=null;
  try{
    const ctl=new AbortController(); timer=setTimeout(()=>ctl.abort(),12000);
    const url='https://es.openfoodfacts.org/cgi/search.pl?search_terms='+encodeURIComponent(t)+'&search_simple=1&action=process&json=1&page_size=24&fields=code,product_name,product_name_es,brands,nutriments';
    const res=await fetch(url,{signal:ctl.signal});
    clearTimeout(timer);
    if(!res.ok) throw new Error('http '+res.status);
    webRes=parseOFF(await res.json());
    if(!document.getElementById('rs-'+i) || draft.rows[i]!==r) return;
    if(!webRes.length){ box.innerHTML='<div class="sug-info">No he encontrado ese producto con calorías.</div>'+manual; return; }
    box.innerHTML='<div class="sug-info">Valores por 100 g. Compáralos con la etiqueta de tu producto: los sube la comunidad.</div>'
      + webRes.map((x,j)=>`<button type="button" class="sug" onclick="pickWeb(${i},${j})"><span>${esc(x.n)}${x.b?` <em>· ${esc(x.b)}</em>`:''}</span><small>${x.k} kcal · P ${x.p} · C ${x.c} · G ${x.f}</small></button>`).join('')
      + manual;
  }catch(e){
    if(timer) clearTimeout(timer);
    if(!document.getElementById('rs-'+i)) return;
    box.innerHTML='<div class="sug-info">No he podido consultar internet ahora mismo. Puedes crearlo a mano con los datos de la etiqueta.</div>'+manual;
  }
}
function pickWeb(i,j){
  const x=webRes[j]; if(!x) return;
  const sig = x.code ? 'w_'+x.code.replace(/[^0-9a-z]/gi,'') : 'w_'+Date.now().toString(36);
  const label = x.b && !norm(x.n).includes(norm(x.b)) ? x.n+' ('+x.b+')' : x.n;
  if(!DATA.customFoods[sig]) DATA.customFoods[sig]={n:label, k:x.k, p:x.p, c:x.c, f:x.f, src:'off', b:x.b||''};
  saveData(); registerCustom();
  pickFood(i,sig);
  toast('Guardado en Mi despensa');
}

/* Pasos copiados al portapapeles por el atajo de iPhone: "8432", "8.432" o "8432,0" */
function parseSteps(txt){
  const m=String(txt||'').match(/\d[\d.,\s]*/);
  if(!m) return null;
  let s=m[0].trim().replace(/\s+/g,'');
  if(/^\d{1,3}([.,]\d{3})+$/.test(s)) s=s.replace(/[.,]/g,'');   // 8.432 u 8,432 -> separador de miles
  else s=s.replace(',','.');                                       // 8432,0 -> decimal
  const n=Math.round(parseFloat(s));
  return (n>=0 && n<=100000) ? n : null;
}
async function pasteSteps(iso){
  let txt='';
  try{ txt = await navigator.clipboard.readText(); }
  catch(e){ toast('No he podido leer el portapapeles: escribe los pasos a mano'); return; }
  const n=parseSteps(txt);
  if(n===null){ toast('Lo copiado no parece un número de pasos'); return; }
  ensureDay(iso).steps=n; saveData(); rerender(renderMenu);
  toast('Pasos de hoy: '+n.toLocaleString('es-ES'));
}

/* =========================================================
   PROGRESO: peso y cintura
   ========================================================= */
const CHARTS = {};
function sortedMeasures(){ return DATA.measures.slice().sort((a,b)=> a.date<b.date ? -1 : (a.date>b.date ? 1 : 0)); }
/* Peso vigente: el último registrado; si no hay ninguno, el peso inicial del perfil */
function W(){
  const l=sortedMeasures().filter(m=>m.w>0);
  return l.length ? l[l.length-1].w : N(DATA.profile.weight);
}
function fm(x,dec){ return Number(x).toFixed(dec===undefined?1:dec).replace('.',','); }
function fmtShort(iso){ return parseISO(iso).toLocaleDateString('es-ES',{day:'numeric',month:'short'}); }

/* pendiente semanal por regresión lineal (necesita al menos 7 días de margen) */
function weeklyRate(list){
  if(list.length<2) return null;
  const t0=parseISO(list[0].date).getTime();
  const xs=list.map(m=>(parseISO(m.date).getTime()-t0)/86400000), ys=list.map(m=>m.v);
  if(xs[xs.length-1]-xs[0] < 7) return null;
  const n=xs.length, mx=xs.reduce((a,b)=>a+b,0)/n, my=ys.reduce((a,b)=>a+b,0)/n;
  let num=0, den=0;
  xs.forEach((x,i)=>{ num+=(x-mx)*(ys[i]-my); den+=(x-mx)*(x-mx); });
  return den ? num/den*7 : null;
}

function chartHtml(id, pts, color, unit, title){
  if(pts.length<2){
    return `<div class="card"><h2>${title}</h2><p class="hint" style="font-size:.84rem;">${pts.length?'Con un segundo registro verás aquí la evolución.':'Todavía no hay registros.'}</p></div>`;
  }
  const Wd=320, Hd=180, L=40, R=20, T=22, B=28;
  const t0=parseISO(pts[0].date).getTime(), t1=parseISO(pts[pts.length-1].date).getTime(), span=Math.max(t1-t0,86400000);
  let vmin=Math.min(...pts.map(p=>p.v)), vmax=Math.max(...pts.map(p=>p.v));
  const pad=Math.max((vmax-vmin)*0.2, 0.5); vmin-=pad; vmax+=pad;
  const X=t=>L+(t-t0)/span*(Wd-L-R), Y=v=>T+(1-(v-vmin)/(vmax-vmin))*(Hd-T-B);
  const P=pts.map(p=>({x:X(parseISO(p.date).getTime()), y:Y(p.v), date:p.date, v:p.v}));
  CHARTS[id]={pts:P, W:Wd, H:Hd, unit};
  const grid=[0,1,2].map(i=>{ const v=vmin+(vmax-vmin)*i/2, y=Y(v);
    return `<line x1="${L}" x2="${Wd-R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" class="gl"/><text x="${L-6}" y="${(y+3.5).toFixed(1)}" text-anchor="end" class="ax">${fm(v)}</text>`; }).join('');
  const path=P.map((q,i)=>`${i?'L':'M'}${q.x.toFixed(1)} ${q.y.toFixed(1)}`).join(' ');
  const last=P[P.length-1];
  const dots=(P.length<=30 ? P : [last]).map(q=>`<circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="4" fill="${color}" stroke="#fff" stroke-width="2"/>`).join('');
  return `<div class="card"><h2>${title}</h2>
    <div class="chart-wrap"><svg id="${id}" viewBox="0 0 ${Wd} ${Hd}" role="img" aria-label="${title}: de ${fm(P[0].v)} a ${fm(last.v)} ${unit}">
      ${grid}
      <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}
      <text x="${Math.min(last.x, Wd-R).toFixed(1)}" y="${(last.y-10).toFixed(1)}" text-anchor="end" class="lv">${fm(last.v)} ${unit}</text>
      <text x="${L}" y="${Hd-8}" class="ax">${fmtShort(P[0].date)}</text>
      <text x="${Wd-R}" y="${Hd-8}" text-anchor="end" class="ax">${fmtShort(last.date)}</text>
      <line id="${id}-x" y1="${T}" y2="${Hd-B}" class="cx" style="display:none"/>
      <circle id="${id}-c" r="6" fill="${color}" stroke="#fff" stroke-width="2" style="display:none"/>
    </svg><div class="tip" id="${id}-t"></div></div></div>`;
}
function attachChart(id){
  const c=CHARTS[id], svg=document.getElementById(id);
  if(!c || !svg) return;
  const tip=document.getElementById(id+'-t'), xl=document.getElementById(id+'-x'), dot=document.getElementById(id+'-c');
  const move=ev=>{
    const r=svg.getBoundingClientRect(), x=(ev.clientX-r.left)/r.width*c.W;
    let best=c.pts[0];
    c.pts.forEach(p=>{ if(Math.abs(p.x-x)<Math.abs(best.x-x)) best=p; });
    xl.setAttribute('x1',best.x); xl.setAttribute('x2',best.x); xl.style.display='';
    dot.setAttribute('cx',best.x); dot.setAttribute('cy',best.y); dot.style.display='';
    tip.style.display='block';
    tip.style.left=(best.x/c.W*r.width)+'px';
    tip.style.top=(best.y/c.H*r.height)+'px';
    tip.textContent=fmtShort(best.date)+' · '+fm(best.v)+' '+c.unit;
  };
  const hide=()=>{ xl.style.display='none'; dot.style.display='none'; tip.style.display='none'; };
  svg.addEventListener('pointermove',move);
  svg.addEventListener('pointerdown',move);
  svg.addEventListener('pointerleave',hide);
}

function renderProgress(){

  const p=DATA.profile, ms=sortedMeasures();
  const ws=ms.filter(m=>m.w>0).map(m=>({date:m.date, v:m.w}));
  const cs=ms.filter(m=>m.c>0).map(m=>({date:m.date, v:m.c}));
  const lastW=ws.length?ws[ws.length-1]:null, lastC=cs.length?cs[cs.length-1]:null;
  const startW=N(p.weight), goal=N(p.goalKg);

  let rows='';
  if(lastW && startW>0){
    const lost=startW-lastW.v;
    rows+=`<div class="stat-row"><span>Peso inicial → actual</span><b>${fm(startW)} → ${fm(lastW.v)} kg</b></div>
      <div class="stat-row"><span>${lost>=0?'Perdido':'Ganado'}</span><b>${fm(Math.abs(lost))} kg</b></div>`;
    if(goal>0 && lost>0){
      const pct=clamp(lost/goal*100,0,100);
      rows+=`<div class="bar" style="margin:10px 0 4px;"><span style="width:${pct.toFixed(0)}%"></span></div>
        <div class="hint" style="margin:0 0 6px;">${Math.round(pct)} % del objetivo de ${fm(goal)} kg</div>`;
    }
  }
  if(cs.length>=2){
    const dc=lastC.v-cs[0].v;
    rows+=`<div class="stat-row"><span>Cintura inicial → actual</span><b>${fm(cs[0].v)} → ${fm(lastC.v)} cm</b></div>
      <div class="stat-row"><span>${dc<=0?'Reducido':'Aumentado'}</span><b>${fm(Math.abs(dc))} cm</b></div>`;
  } else if(cs.length===1){
    rows+=`<div class="stat-row"><span>Cintura</span><b>${fm(lastC.v)} cm</b></div>`;
  }
  let notes='';
  if(lastW){
    const win=ws.filter(m=>parseISO(m.date)>=addDays(parseISO(lastW.date),-28));
    const rate=weeklyRate(win);
    if(rate!==null){
      rows+=`<div class="stat-row"><span>Ritmo reciente</span><b>${rate>0?'+':'−'}${fm(Math.abs(rate),2)} kg/semana</b></div>`;
      if(rate<0 && Math.abs(rate)>0.01*lastW.v){
        notes+=`<div class="warn">Estás perdiendo más de un 1 % de tu peso por semana. Es un ritmo alto; conviene revisarlo con un profesional.</div>`;
      }
    }
  }
  const summary = rows
    ? `<div class="card"><h2>Resumen</h2>${rows}${notes}<p class="hint">El peso incluye agua, músculo y grasa, y varía de un día a otro. Fíjate en la tendencia de varias semanas y en la cintura.</p></div>`
    : `<div class="card"><h2>Resumen</h2><p class="hint" style="font-size:.84rem;">Registra tu primer peso o medida para empezar a ver tu evolución.</p></div>`;

  const history = ms.slice().reverse().map(m=>
    `<div class="ing-row"><span>${fmtShort(m.date)} <span style="opacity:.55">${parseISO(m.date).getFullYear()}</span> · ${m.w>0?fm(m.w)+' kg':'—'} · ${m.c>0?fm(m.c)+' cm':'—'}</span><button onclick="deleteMeasure('${m.date}')">✕</button></div>`).join('');

  el.innerHTML = `<div class="card"><h2>Registrar medidas</h2>
    <div class="field"><label>Fecha</label><input id="pm-date" type="date" value="${todayISO()}"></div>
    <div class="grid2">
      <div class="field"><label>Peso (kg)</label><input id="pm-w" type="number" inputmode="decimal" step="0.1" placeholder="${lastW?fm(lastW.v):''}"></div>
      <div class="field"><label>Cintura (cm)</label><input id="pm-c" type="number" inputmode="decimal" step="0.1" placeholder="${lastC?fm(lastC.v):''}"></div>
    </div>
    <button class="btn primary" style="width:100%;" onclick="saveMeasure()">Guardar</button>
    <p class="hint">Pésate a la misma hora, por ejemplo en ayunas, y mide la cintura siempre igual: a la altura del ombligo, de pie y sin apretar. Puedes guardar solo una de las dos. Las kcal del menú se recalculan con tu último peso.</p></div>
    ${summary}
    ${chartHtml('chart-w', ws, '#B5623A', 'kg', 'Peso')}
    ${chartHtml('chart-c', cs, '#5B7B5A', 'cm', 'Cintura')}
    ${history?`<div class="card"><h2>Historial</h2>${history}</div>`:''}`;
  attachChart('chart-w'); attachChart('chart-c');
}
function saveMeasure(){
  const val=id=>String(document.getElementById(id).value||'').replace(',','.');
  const date=val('pm-date') || todayISO();
  const wv=val('pm-w'), cv=val('pm-c');
  const w = wv==='' ? null : Number(wv), c = cv==='' ? null : Number(cv);
  if(w===null && c===null){ toast('Pon el peso o la cintura'); return; }
  if(w!==null && !(w>=35 && w<=250)){ toast('El peso debe estar entre 35 y 250 kg'); return; }
  if(c!==null && !(c>=40 && c<=200)){ toast('La cintura debe estar entre 40 y 200 cm'); return; }
  let e=DATA.measures.find(m=>m.date===date);
  if(!e){ e={date, w:null, c:null}; DATA.measures.push(e); }
  if(w!==null) e.w=w;
  if(c!==null) e.c=c;
  saveData(); renderProgress(); toast('Registrado');
}
function deleteMeasure(date){
  if(!confirm('¿Borrar el registro del '+fmtShort(date)+'?')) return;
  DATA.measures=DATA.measures.filter(m=>m.date!==date);
  saveData(); renderProgress();
}

/* Receta propia como plato del menú, sea cual sea la comida donde se quiera poner */
function customRecipeById(id){
  const r=DATA.myRecipes.find(x=>'u_'+x.id===id);
  if(!r || !FOODS[id]) return null;
  return {id, name:r.name, custom:true, auto:r.auto!==false, items:[{f:id, g:Number(r.portionG)||250, s:1}]};
}
function swapListHtml(iso, slotKey, pool, cur){
  const btn=r=>`<button class="pick-item ${r.id===cur?'sel':''}" onclick="swapTo('${iso}','${slotKey}','${r.id}')">${esc(r.name)}</button>`;
  const mine=DATA.myRecipes.map(r=>customRecipeById('u_'+r.id)).filter(Boolean);
  const suggested=RECIPES[pool].filter(r=>!r.custom);
  const mineHtml = mine.length
    ? `<h4 class="sw-h">Mis recetas habituales</h4>${mine.map(btn).join('')}`
    : `<p class="hint" style="margin:0 0 6px;">Aún no tienes recetas habituales: créalas en la pestaña Recetas.</p>`;
  return `${mineHtml}<h4 class="sw-h">Sugeridas</h4>${suggested.map(btn).join('')}`;
}

/* Poner una receta habitual en un día y comida concretos */
const POOL_SLOT = {desayuno:'desayuno', snack:'almuerzo', comida:'comida', cena:'cena'};
function openAddToMenu(id){
  const r=DATA.myRecipes.find(x=>x.id===id); if(!r) return;
  const start=startOfWeek(new Date());
  const days=Array.from({length:14},(_,i)=>fmtISO(addDays(start,i)));
  const today=todayISO();
  const dayOpts=days.map(iso=>`<option value="${iso}" ${iso===today?'selected':''}>${cap(DAY_NAMES[weekdayIdx(iso)])} ${parseISO(iso).getDate()} ${parseISO(iso).toLocaleDateString('es-ES',{month:'short'})}</option>`).join('');
  const defSlot = (r.pools&&r.pools[0]) ? POOL_SLOT[r.pools[0]] : 'comida';
  const slotOpts=SLOTS.map(s=>`<option value="${s.key}" ${s.key===defSlot?'selected':''}>${s.label}</option>`).join('');
  document.getElementById('sheet').innerHTML = `<div class="sheet-head"><h3>Poner en el menú</h3><button onclick="closeSheet()">✕</button></div>
    <p class="hint" style="margin:-6px 0 12px;">${esc(r.name)}: sustituirá el plato que haya en esa comida y la cantidad se ajustará a las kcal del día.</p>
    <div class="grid2">
      <div class="field"><label>Día</label><select id="am-day">${dayOpts}</select></div>
      <div class="field"><label>Comida</label><select id="am-slot">${slotOpts}</select></div>
    </div>
    <button class="btn primary" style="width:100%;" onclick="putInMenu('${r.id}')">Poner en el menú</button>`;
  document.getElementById('overlay').classList.add('open');
}
function putInMenu(id){
  const iso=document.getElementById('am-day').value, slot=document.getElementById('am-slot').value;
  if(!profileOk()){ toast('Primero completa tus datos en Objetivo'); return; }
  const key='u_'+id;
  if(!FOODS[key]){ toast('La receta no es válida'); return; }
  if(!DATA.menus[iso]) generateWeek([iso], false);
  if(!DATA.menus[iso]) DATA.menus[iso]={};
  DATA.menus[iso][slot]=key;
  saveData(); closeSheet();
  toast('Puesta en el menú del '+DAY_NAMES[weekdayIdx(iso)]+' '+parseISO(iso).getDate());
}

/* ---- Lista de recetas habituales con calculadora de ración ---- */
function renderRecipes(){
  const el=document.getElementById('view-recipes');
  const list=DATA.myRecipes.filter(r=>recipeTotals(r).w>0);
  let html=`<div class="tools"><button class="btn primary" onclick="openRecipeForm()">＋ Nueva receta</button></div>`;
  if(!list.length){
    html+=`<div class="card"><h2>Tus recetas habituales</h2><p class="hint" style="font-size:.86rem; opacity:.75;">Guarda aquí los platos que cocinas a menudo: con sus ingredientes y gramos, o directamente con las kcal de una ración. Se quedan guardadas en tu móvil y puedes cambiar cualquier plato del menú por ellas: toca el nombre del plato en el menú, o usa «Poner en el menú» desde aquí.</p></div>`;
  } else {
    html+=`<h2 style="font-size:1.05rem; margin:4px 2px 10px;">Mis recetas habituales <span style="opacity:.5; font-weight:500; font-family:'Inter',sans-serif; font-size:.85rem;">· ${list.length}</span></h2>`;
  }
  list.forEach(r=>{
    const t=recipeTotals(r), per=100/t.w;
    const where=(r.pools||[]).map(p=>POOLS.find(x=>x.key===p).label.toLowerCase()).join(', ');
    html+=`<div class="card"><div class="rec-name">${esc(r.name)}</div>
      <div class="rec-meta">${Math.round(t.k*per)} kcal / 100 g · P ${(t.p*per).toFixed(1)} · C ${(t.c*per).toFixed(1)} · G ${(t.f*per).toFixed(1)}${r.direct?' · valores por ración':''}</div>
      <div class="field"><label>Peso de tu ración (g)</label><input type="number" inputmode="decimal" value="${r.portionG}" oninput="calcPortion('${r.id}',this.value)"></div>
      <div class="calc-out" id="co-${r.id}"></div>
      <div class="rec-meta">${where ? 'Se sugiere sola en: '+esc(where)+(r.auto!==false?'':' (solo cuando la eliges tú)') : 'No se sugiere sola; puedes ponerla tú en cualquier comida'}</div>
      <button class="btn primary" style="width:100%; margin:8px 0 6px;" onclick="openAddToMenu('${r.id}')">Poner en el menú</button>
      <div class="tools" style="margin:0;"><button class="btn" onclick="openRecipeForm('${r.id}')">Editar</button><button class="btn" onclick="deleteRecipe('${r.id}')">Borrar</button></div></div>`;
  });
  const nBase=Object.keys(FOODS).filter(k=>!FOODS[k].dish).length, nOwn=Object.keys(DATA.customFoods).length, nMod=Object.keys(DATA.overrides||{}).length;
  html+=`<div class="card"><h2>Mi despensa</h2>
    <p class="hint" style="font-size:.84rem; opacity:.75; margin:0 0 10px;">${nBase} alimentos con sus kcal${nOwn?` · ${nOwn} tuyos`:''}${nMod?` · ${nMod} corregidos`:''}. Busca uno para ver sus valores, corregirlos o añadir los tuyos.</p>
    <button class="btn" style="width:100%;" onclick="openPantry()">🥫 Abrir mi despensa</button></div>`;
  el.innerHTML=html;
  list.forEach(r=>calcPortion(r.id, r.portionG));
}
function calcPortion(id,v){
  const r=DATA.myRecipes.find(x=>x.id===id), out=document.getElementById('co-'+id);
  if(!r||!out) return;
  const g=Number(v);
  if(!(g>0)){ out.innerHTML=''; return; }
  const t=recipeTotals(r); if(!(t.w>0)) return;
  const q=g/t.w;
  out.innerHTML=`<b>${Math.round(t.k*q)} kcal</b> · P ${Math.round(t.p*q)} g · C ${Math.round(t.c*q)} g · G ${Math.round(t.f*q)} g`;
}

/* =========================================================
   NAVEGACIÓN
   ========================================================= */
function switchView(name){
  ['menu','recipes','profile','month','progress'].forEach(v=>{
    document.getElementById('view-'+v).classList.toggle('active', v===name);
    document.getElementById('nav-'+v).classList.toggle('active', v===name);
  });
  const t={menu:'Menú semanal', recipes:'Mis recetas', profile:'Tu objetivo', month:'Calendario', progress:'Tu progreso'};
  const s={menu:'5 comidas al día con cantidades ajustadas', recipes:'Calcula las kcal de tu ración', profile:'Calorías y macros según tus datos', month:'Verde = día cumplido · toca un día para registrarlo', progress:'Peso y cintura'};
  document.getElementById('headerTitle').textContent=t[name];
  document.getElementById('headerSub').textContent=s[name];
  if(name==='menu') renderMenu();
  if(name==='profile') renderProfile();
  if(name==='month') renderMonth();
  if(name==='recipes') renderRecipes();
  if(name==='progress') renderProgress();
  window.scrollTo(0,0);
}

/* =========================================================
   INICIO: pasos desde el atajo (?pasos=1234)
   ========================================================= */
(function init(){
  const q=new URLSearchParams(location.search), ps=q.get('pasos');
  if(ps!==null && ps!=='' && !isNaN(Number(ps))){
    ensureDay(todayISO()).steps = Math.max(0, Math.round(Number(ps)));
    saveData();
    history.replaceState(null,'',location.pathname);
    setTimeout(()=>toast('Pasos de hoy: '+Math.round(Number(ps)).toLocaleString('es-ES')),300);
  }
  switchView(profileOk() ? 'menu' : 'profile');
})();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
